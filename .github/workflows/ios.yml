# iOS 앱 빌드와 시뮬레이터 점검. 맥에 Xcode 가 없어도 여기서 ipa 를 만든다.
name: ios
on:
  workflow_dispatch:
  push:
    branches: [main, ios-ci]
    paths: ["ios/**", "host/**", "tests/**", "mac/Sources/RetroEmu/Sync*.swift", ".github/workflows/ios.yml"]

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: 코어 받기
        run: ./fetch-cores.sh ios
      - name: 시뮬레이터용 빌드
        run: ./ios/build.sh sim
      - name: 기기용 ipa
        run: ./ios/build.sh device
      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: ios/dist/RetroEmu-ios.ipa
      - name: 시뮬레이터에서 띄워 보기
        run: |
          set -x
          UDID=$(xcrun simctl create t "iPhone 16" | tail -1)
          xcrun simctl boot $UDID
          xcrun simctl bootstatus $UDID -b
          xcrun simctl install $UDID ios/dist/sim/Payload/RetroEmu.app
          DATA=$(xcrun simctl get_app_container $UDID com.hayoonjae.retroemu data)
          mkdir -p "$DATA/Documents/roms" shots
          cp tests/test.nes "$DATA/Documents/roms/"
          # 목록
          xcrun simctl launch $UDID com.hayoonjae.retroemu
          sleep 6; xcrun simctl io $UDID screenshot shots/1-library.png
          xcrun simctl terminate $UDID com.hayoonjae.retroemu
          # 게임(세로)
          xcrun simctl launch $UDID com.hayoonjae.retroemu --rom "$DATA/Documents/roms/test.nes"
          sleep 10; xcrun simctl io $UDID screenshot shots/2-game.png
          # 홈으로 보내면(다른 앱을 띄우면) 자동 저장돼야 한다
          xcrun simctl launch $UDID com.apple.Preferences
          sleep 3
          xcrun simctl terminate $UDID com.hayoonjae.retroemu
          sleep 2
          # 다시 켜면 자동 저장 목록부터
          ls -la "$DATA/Documents/saves" || true
          xcrun simctl launch $UDID com.hayoonjae.retroemu --rom "$DATA/Documents/roms/test.nes"
          sleep 6; xcrun simctl io $UDID screenshot shots/3-slots.png
          xcrun simctl terminate $UDID com.hayoonjae.retroemu
          # 크게 + 조이스틱 (저장 목록이 안 뜨게 저장은 지우고)
          rm -rf "$DATA/Documents/saves"
          xcrun simctl launch $UDID com.hayoonjae.retroemu --rom "$DATA/Documents/roms/test.nes" -bigButtons YES -joystick YES
          sleep 5; xcrun simctl io $UDID screenshot shots/4-game-big.png
          xcrun simctl terminate $UDID com.hayoonjae.retroemu
          # DS(직접 만든 테스트 롬)와 PSP(OpenGL ES 경로, 테스트 프로그램)
          cp tests/test.nds tests/test-psp.pbp tests/test-psp.elf "$DATA/Documents/roms/"
          xcrun simctl launch $UDID com.hayoonjae.retroemu --rom "$DATA/Documents/roms/test.nds"
          sleep 8; xcrun simctl io $UDID screenshot shots/5-ds.png
          xcrun simctl terminate $UDID com.hayoonjae.retroemu
          xcrun simctl launch --stdout=$PWD/shots/psp-out.txt --stderr=$PWD/shots/psp-err.txt $UDID com.hayoonjae.retroemu --rom "$DATA/Documents/roms/test-psp.pbp"
          sleep 15; xcrun simctl io $UDID screenshot shots/6-psp.png
          tail -60 shots/psp-err.txt shots/psp-out.txt || true
          # 꺼졌으면 충돌 보고서
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/RetroEmu* 2>/dev/null | head -1); do cp "$f" shots/; head -c 6000 "$f"; done || true
          xcrun simctl spawn $UDID log show --last 3m --predicate 'process == "RetroEmu"' --style compact | grep -iE "rhost|\[pad\]|error|OpenGL|hw render" | tail -30 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots/
